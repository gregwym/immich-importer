name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Fetch ExifTool source for real XMP parser test
        run: |
          git clone https://github.com/exiftool/exiftool.git "$RUNNER_TEMP/exiftool"
          git -C "$RUNNER_TEMP/exiftool" checkout 2200871d9cef988051d2a99d67df3bda6cbb30a8
      - name: Run tests
        env:
          EXIFTOOL_BIN: ${{ runner.temp }}/exiftool/exiftool
        run: python -m unittest discover -s tests -v
